services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: battery
      POSTGRES_USER: battery
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your shell}
    volumes:
      - battery-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U battery -d battery"]
      interval: 5s
      retries: 10
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://battery:${POSTGRES_PASSWORD}@db:5432/battery
      CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      db:
        condition: service_healthy
volumes:
  battery-data:
